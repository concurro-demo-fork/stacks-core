name: stacks-core demo tools
description: Install shared tools from the approved base; workspace installs belong in each working copy.
inputs:
  base:
    description: Absolute path to the approved upstream checkout
    required: true
runs:
  using: composite
  steps:
    - name: Install the repository toolchain
      shell: bash
      working-directory: ${{ inputs.base }}
      run: |
        rustup show active-toolchain
        rustup component add rustfmt clippy
    - name: Install nextest
      uses: taiki-e/install-action@65851e10cd6c377f11a60e600abc07cb08643468 # v2.79.3
      with:
        tool: nextest@0.9.145

    # The lodestone index built by .github/workflows/lodestone-index.yml; cache paths and keys
    # must stay identical to that workflow's. A miss leaves the `lodestone` MCP server
    # unavailable; nothing here builds or indexes.
    - name: Resolve the lodestone index
      id: lodestone
      shell: bash
      working-directory: ${{ inputs.base }}
      run: |
        echo "rev=$(tr -d '[:space:]' < "$GITHUB_ACTION_PATH/lodestone-rev")" >> "$GITHUB_OUTPUT"
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "$HOME/.lodestone/bin" >> "$GITHUB_PATH"

    - name: Restore lodestone and its model
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.lodestone/bin
          ~/.lodestone/models
        key: lodestone-tools-${{ steps.lodestone.outputs.rev }}

    # The newest index when none matches this base: the first search of a turn then indexes
    # only what differs.
    - name: Restore the lodestone index
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.lodestone/worktrees
          ~/.lodestone/cache.sqlite
          ~/.lodestone/registry.json
        key: lodestone-index-${{ steps.lodestone.outputs.rev }}-${{ steps.lodestone.outputs.sha }}
        restore-keys: lodestone-index-${{ steps.lodestone.outputs.rev }}-
